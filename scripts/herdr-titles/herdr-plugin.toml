id = "titles"
name = "Agent Titles"
version = "0.2.0"
description = "Report each agent pane's live task title and herdr agent name to the sidebar as $task/$name, and name its tab (Claude + Codex)"
min_herdr_version = "0.8.0"   # agent.rename + AgentInfo.name (0.8.0); pane metadata (0.7.4); [[startup]] (0.7.5)
platforms = ["macos"]

# The plugin [[events]] hook surface carries no title-change event (agent_status_changed
# only flips on idle<->working), but the socket API's events.subscribe does: pane.updated
# fires on every terminal-title change, and /rename emits an OSC title so it shows there
# too. So a small push daemon (titles.py watch) holds that subscription and does the work;
# these hooks just `ensure` it is running. ensure is idempotent (pidfile-guarded) and
# near-instant. The [[startup]] hook (herdr 0.7.5) runs once per enabled plugin right after
# herdr restores the session and its socket is ready, and again on live handoff, so the
# daemon comes up deterministically on restore/handoff — previously we leaned on
# pane.agent_status_changed firing for restored agents to catch this. pane.agent_detected
# stays as the safety net: it fires exactly when an agent appears (including in a
# pre-existing pane, which pane.created misses), re-ensuring the daemon after an
# unexpected crash the moment there is title work to do.
[[startup]]
command = ["sh", "-lc", "exec python3 \"$HERDR_PLUGIN_ROOT/titles.py\" ensure"]

[[events]]
on = "pane.agent_detected"
command = ["sh", "-lc", "exec python3 \"$HERDR_PLUGIN_ROOT/titles.py\" ensure"]

# Rename popup. A small framed box: header, name input, hint/error line. Sized in
# cells for the height (fixed content) and a % for the width (names are short but
# herdr's error messages are not). The pane it renames is resolved by the action
# below and handed over in TITLES_TARGET_PANE — once the popup takes focus it can
# only see its own pane's context.
[[panes]]
id = "rename-agent"
title = "Rename agent"
placement = "popup"
width = "58%"
height = 9
command = ["sh", "-lc", "exec python3 \"$HERDR_PLUGIN_ROOT/titles.py\" rename-ui"]

# Rename the focused agent pane (herdr's own agent name, i.e. `herdr agent rename`).
# The popup writes the $name token itself on success, so the rename is on screen
# immediately instead of waiting for the daemon's next refresh tick.
[[actions]]
id = "rename"
title = "Agent name: rename this pane"
contexts = ["workspace"]
command = ["sh", "-lc", "exec python3 \"$HERDR_PLUGIN_ROOT/titles.py\" rename-open"]

# Force an immediate full refresh of every agent pane's $task/$name and tab name.
# Bind to a key for a manual kick; the daemon already keeps things current within
# one refresh interval (60s), and pushes terminal-title changes instantly.
[[actions]]
id = "refresh"
title = "Sidebar titles: refresh all"
contexts = ["workspace"]
command = ["sh", "-lc", "exec python3 \"$HERDR_PLUGIN_ROOT/titles.py\" report-all"]
